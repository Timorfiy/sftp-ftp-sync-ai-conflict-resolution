name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  protocol-acceptance:
    name: ${{ matrix.os }} ${{ matrix.protocol }} acceptance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
        protocol:
          - ftp
          - sftp

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ${{ matrix.protocol }} loopback acceptance
        run: npm run test:acceptance:${{ matrix.protocol }}

  quality:
    name: ${{ matrix.os }} quality gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Add isolated macOS loopback alias for binding tests
        id: loopback
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2

      - name: Run tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Package and inspect universal VSIX
        run: npm run package

      - name: Remove macOS test loopback alias
        if: always() && steps.loopback.outcome == 'success'
        run: sudo ifconfig lo0 -alias 127.0.0.2

  case-sensitive-apfs:
    name: macOS case-sensitive APFS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify paths, permissions and watcher on case-sensitive APFS
        run: node scripts/test-case-sensitive-apfs.js
